<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>

<header>
    <h1>Israel web Design</h1>
</header>

<main>
    <div id="message"></div>
    <form action="forms.html" method="get" id="myForm">

        <fieldset>
            <legend>Sign Up Form</legend>

            <div class="form-row">
                <label for="name">Name:</label>
                <input type="text" name="fullname" id="name" required>
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="name@email.com">
            </div>

            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" name="pass" id="password">
            </div>

            <div class="form-row">
                <label for="birthdate">Date of Birth:</label>
                <input type="date" name="birthdate" id="birthdate" class="short-input">
            </div>

            <div class="form-row">
                <label for="age">Age:</label>
                <input type="number" name="age" id="age" min="0" max="100">
            </div>

            <div class="form-row">
                <label for="state">State:</label>
                <select name="state" id="state">
                    <option value="CA">California</option>
                    <option value="HI">Hawaii</option>
                    <option value="UT">Utah</option>
                </select>
            </div>

            <div class="form-row">
                <label for="comments">Comments:</label>
                <textarea name="comments" id="comments"></textarea>
            </div>

            <div class="form-row">
                <label class="group-label">Gender:</label>
                <div class="option-group">
                    <label class="option-label"><input type="radio" name="gender" value="male"> Male</label>
                    <label class="option-label"><input type="radio" name="gender" value="female"> Female</label>
                </div>
            </div> 

            <div class="form-row">
                <label class="group-label">Languages Known:</label>
                <div class="option-group">
                    <label class="option-label"><input type="checkbox" name="language" value="english"> English</label>
                    <label class="option-label"><input type="checkbox" name="language" value="telugu"> Telugu</label>
                    <label class="option-label"><input type="checkbox" name="language" value="hindi"> Hindi</label>
                </div>
            </div>

            <div class="form-row">
                <label for="skill">Proficiency:</label>
                <input type="range" name="skill" id="skill" min="0" max="100" value="50">
            </div>

            <div class="checkbox-row">
                <span class="spacer"></span>
                <div class="option-group">
                    <label class="option-label">
                        <input type="checkbox" name="remember" value="yes" checked> Remember me?
                    </label>
                </div>
            </div>

            <div class="form-row">
                <span class="spacer"></span>
                <input type="submit" value="Sign Up">
            </div>

        </fieldset>

    </form>

</main>

<footer>
    <p>&copy; 2026 Israel Limma</p>
</footer>


<script src="forms.js"></script>
</body>
</html>
