<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Form</title>
    <link rel="stylesheet" href="final2.css">
</head>
<body>

<header>
    <h1 id="formTitle">Add a Recipe</h1>
</header>

<nav>
    <a href="final2.html">Home</a>
    <a href="meals.html">Meals</a>
    <a href="sweets.html">Sweets</a>
    <a href="drinks.html">Drinks</a>
    <a href="tips.html">Tips</a>
    <a href="table.html">Table</a>
    <a href="form.html" class="active">Form</a>
</nav>

<main>
    <h2>Edit a Recipe</h2>
    <p>If you already added a recipe, enter the recipe name and your 3-digit code to edit it.</p>

    <label for="editRecipeName">Recipe Name</label>
    <input type="text" id="editRecipeName">

    <label for="editCode">3-Digit Code</label>
    <input type="text" id="editCode" maxlength="3">

    <button type="button" id="loadEditButton">Load Recipe for Edit</button>

    <p id="editMessage"></p>

    <h2>Add or Update Recipe</h2>
    <p>Use this form to add a new recipe or update your old recipe.</p>

    <form id="recipeForm">
        <label for="recipeName">Recipe Name</label>
        <input type="text" id="recipeName" required>

        <label for="category">Category</label>
        <select id="category" required>
            <option value="">Select one</option>
            <option value="Meal">Meal</option>
            <option value="Sweet">Sweet</option>
            <option value="Drink">Drink</option>
        </select>

        <label for="image">Image URL</label>
        <input type="text" id="image">

        <label for="description">Description</label>
        <textarea id="description" rows="3" required></textarea>

        <label for="time">Cooking Time</label>
        <input type="text" id="time" required>

        <label for="difficulty">Difficulty</label>
        <select id="difficulty" required>
            <option value="">Select one</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <label for="cost">Cost</label>
        <select id="cost" required>
            <option value="">Select one</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <label for="spice">Spice Level</label>
        <select id="spice" required>
            <option value="">Select one</option>
            <option value="None">None</option>
            <option value="Mild">Mild</option>
            <option value="Medium">Medium</option>
            <option value="Hot">Hot</option>
        </select>

        <label for="ingredients">Ingredients</label>
        <textarea id="ingredients" rows="4" placeholder="Rice, dal, salt, oil" required></textarea>

        <label for="steps">Steps</label>
        <textarea id="steps" rows="4" placeholder="Wash rice, boil water, cook rice" required></textarea>

        <button type="submit" id="submitButton">Add Recipe</button>
    </form>

    <p id="message"></p>
    <button type="button" id="showFormButton" style="display:none;">Add Another Recipe</button>
</main>

<footer>
    <p>&copy; Israel Limma</p>
</footer>

<script src="script.js"></script>

</body>
</html>
